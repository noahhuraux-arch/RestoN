services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
            target: prod
        container_name: symfony-php
        env_file:
            - .env.prod
        environment:
            APP_ENV: prod
            APP_DEBUG: 0
        depends_on:
            - db

    nginx:
        build:
            context: .
            dockerfile: Dockerfile
            target: resto_nginx
        container_name: symfony-nginx
        ports:
            - "8080:80"
        depends_on:
            - php

    db:
        image: mariadb:10.2
        container_name: symfony-db
        env_file:
            - .env.prod
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"

volumes:
    db_data:
