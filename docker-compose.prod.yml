services:
    php:
        build:
            context: .
            dockerfile: Dockerfile.prod
            target: production
        container_name: symfony-php
        env_file:
            - .env.prod
        environment:
            APP_ENV: prod
            APP_DEBUG: 0
        restart: always
        depends_on:
            db:
                condition: service_healthy
        networks:
            - resto-network
        volumes:
            - ./var/log:/var/www/html/var/log:rw
            - public_assets:/var/www/html/public
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    nginx:
        build:
            context: .
            dockerfile: Dockerfile.prod
            target: nginx-prod
        container_name: symfony-nginx
        ports:
            - "80:80"
        restart: always
        depends_on:
            - php
        networks:
            - resto-network
        volumes:
            - public_assets:/var/www/html/public:ro
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    db:
        image: mariadb:10.2
        container_name: symfony-db
        env_file:
            - .env.prod
        restart: always
        networks:
            - resto-network
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pChangeMe!RootPassword"]
            timeout: 20s
            retries: 10
            interval: 10s
            start_period: 40s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

networks:
    resto-network:
        driver: bridge

volumes:
    public_assets:
        driver: local
    db_data:
        driver: local
