services:
    nginx:
        build:
            context: .
            dockerfile: Dockerfile
            target: resto_nginx
        container_name: symfony-nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
        depends_on:
            - php

    php:
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        container_name: symfony-php
        volumes:
            - ./:/var/www/html
        environment:
            APP_ENV: dev
        depends_on:
            - db

    db:
        image: mariadb:10.2
        container_name: symfony-db
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: symfony
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data:
